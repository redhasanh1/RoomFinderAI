<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negotiation Lab — RoomFinderAI</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0C1016; --panel:#141A22; --panel2:#1B222C; --line:#2A3440;
    --ink:#E8EEF5; --ink2:#9CAAB9; --ink3:#69788A;
    --accent:#3DD6B5; --accent-dim:rgba(61,214,181,.12);
    --warn:#E8A33D; --crit:#F0637E;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:grid;grid-template-columns:300px 1fr;height:100vh;overflow:hidden}
  @media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto;height:auto}}

  aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow-y:auto}
  h1{font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
  .sub{font-size:12px;color:var(--ink3);margin:0 0 22px;line-height:1.5}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink3);margin:16px 0 6px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .grp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:26px 0 2px;padding-top:14px;border-top:1px solid var(--line)}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);
    margin:8px 0 0;text-transform:none;letter-spacing:0;font-family:inherit}
  .check input{width:auto;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{width:auto;margin:0;padding:5px 10px;font-size:11.5px;font-weight:600;
    font-family:var(--mono);background:var(--panel2);color:var(--ink3);
    border:1px solid var(--line);border-radius:6px}
  .chips button.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
  .chips button:hover{filter:none;color:var(--ink)}
  .chips button.on:hover{color:var(--accent)}
  .ceil{margin-top:20px;padding:12px 14px;background:var(--accent-dim);border:1px solid var(--accent);
    border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--accent);line-height:1.5}
  button{width:100%;margin-top:18px;background:var(--accent);color:#06231D;border:0;border-radius:8px;
    padding:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.08)} button:disabled{opacity:.5;cursor:default}

  main{display:flex;flex-direction:column;min-height:0}
  .log{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:min(660px,88%);padding:12px 15px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap}
  .ll{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
  .ai{background:var(--accent-dim);border:1px solid var(--accent);align-self:flex-end;border-bottom-right-radius:3px}
  .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink3);margin-bottom:5px}
  .meta{align-self:flex-end;max-width:min(660px,88%);font-family:var(--mono);font-size:11px;
    color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--panel)}
  .chip.commit{color:var(--accent);border-color:var(--accent)}
  .chip.fired{color:var(--crit);border-color:var(--crit)}
  .empty{margin:auto;text-align:center;color:var(--ink3);font-size:14px;max-width:380px;line-height:1.6}
  .bar{border-top:1px solid var(--line);background:var(--panel);padding:14px 18px;display:flex;gap:10px}
  .bar input{flex:1}
  .bar button{width:auto;margin:0;padding:10px 22px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px;background:var(--panel)}
  .quick button{width:auto;margin:0;padding:5px 10px;font-size:11.5px;font-weight:600;
    background:var(--panel2);color:var(--ink2);border:1px solid var(--line);font-family:var(--mono)}
  .quick button:hover{color:var(--ink);border-color:var(--ink3);filter:none}
  .err{color:var(--crit);font-size:13px;align-self:center;font-family:var(--mono)}
</style>
</head>
<body>
<aside>
  <h1>Negotiation Lab</h1>
  <p class="sub">You play the landlord. The AI negotiates using only the parameters below — set them, then try to push it above your ceiling.</p>

  <label for="price">Listing asking price</label>
  <input id="price" type="number" value="3675">

  <p class="grp">Price goals</p>
  <label for="budget">Max rent you can pay</label>
  <input id="budget" type="number" value="3200">
  <label for="reduction">Target reduction ($/mo)</label>
  <input id="reduction" type="number" value="" placeholder="e.g. 200">
  <label class="check"><input type="checkbox" id="ask_utilities_included"> Ask for utilities included</label>
  <label class="check"><input type="checkbox" id="ask_lower_deposit"> Ask for lower deposit</label>
  <label class="check"><input type="checkbox" id="ask_first_month_free"> Ask for first month free</label>

  <p class="grp">Move-in &amp; lease</p>
  <label for="movein">Move-in date</label>
  <input id="movein" type="text" value="Sept 1" placeholder="blank = flexible">
  <label for="flex">Flexibility</label>
  <select id="flex">
    <option value="">— skip —</option>
    <option value="exact">Exact date</option>
    <option value="1week">± 1 week</option>
    <option value="2weeks">± 2 weeks</option>
    <option value="flexible">Flexible</option>
  </select>
  <label>Lease length</label>
  <div class="chips" data-single="1" id="lease_length">
    <button type="button" data-v="6 months">6 months</button>
    <button type="button" data-v="12 months">12 months</button>
    <button type="button" data-v="month-to-month">Month-to-month</button>
    <button type="button" data-v="flexible">Flexible</button>
  </div>

  <p class="grp">Availability</p>
  <label>Days you can view</label>
  <div class="chips" id="available_days">
    <button type="button" data-v="monday">Mon</button>
    <button type="button" data-v="tuesday">Tue</button>
    <button type="button" data-v="wednesday">Wed</button>
    <button type="button" data-v="thursday">Thu</button>
    <button type="button" data-v="friday">Fri</button>
    <button type="button" data-v="saturday" class="on">Sat</button>
    <button type="button" data-v="sunday" class="on">Sun</button>
  </div>
  <label>Time of day</label>
  <div class="chips" id="available_time">
    <button type="button" data-v="morning">Morning</button>
    <button type="button" data-v="afternoon">Afternoon</button>
    <button type="button" data-v="evening">Evening</button>
  </div>
  <label>Meeting format</label>
  <div class="chips" data-single="1" id="meeting_format">
    <button type="button" data-v="in-person tour">In-person</button>
    <button type="button" data-v="video call">Video call</button>
    <button type="button" data-v="phone">Phone</button>
  </div>

  <p class="grp">About you</p>
  <label for="employment">Employment</label>
  <select id="employment">
    <option value="">— skip —</option>
    <option value="employed">Employed full-time</option>
    <option value="student">Student</option>
    <option value="self_employed">Self-employed</option>
    <option value="other">Other</option>
  </select>
  <label for="income_confidence">Income</label>
  <select id="income_confidence">
    <option value="">— skip —</option>
    <option value="strong">Strong / well above rent</option>
    <option value="average">Comfortably covers rent</option>
    <option value="building">Building credit / co-signer</option>
  </select>
  <label for="pets">Pets</label>
  <select id="pets">
    <option value="">— skip —</option>
    <option value="none">No pets</option>
    <option value="cat">Cat(s)</option>
    <option value="dog">Dog(s)</option>
    <option value="other">Other</option>
  </select>
  <label for="occupants">Occupants</label>
  <input id="occupants" type="number" min="1" max="10" value="" placeholder="1">
  <label class="check"><input type="checkbox" id="non_smoker"> Non-smoker</label>

  <p class="grp">Must haves</p>
  <div class="chips" id="must_haves">
    <button type="button" data-v="parking">Parking</button>
    <button type="button" data-v="in-unit laundry">In-unit laundry</button>
    <button type="button" data-v="pet-friendly">Pet-friendly</button>
    <button type="button" data-v="furnished">Furnished</button>
    <button type="button" data-v="dishwasher">Dishwasher</button>
    <button type="button" data-v="accessible">Accessible</button>
  </div>

  <p class="grp">Style</p>
  <label>Tone</label>
  <div class="chips" data-single="1" id="tone">
    <button type="button" data-v="friendly">Friendly</button>
    <button type="button" data-v="professional">Professional</button>
    <button type="button" data-v="firm">Firm</button>
  </div>
  <label>Assertiveness</label>
  <div class="chips" data-single="1" id="assertiveness">
    <button type="button" data-v="low">Low</button>
    <button type="button" data-v="medium">Medium</button>
    <button type="button" data-v="high">High</button>
  </div>

  <div class="ceil" id="ceil"></div>
  <button id="reset" type="button">Start over</button>
</aside>

<main>
  <div class="log" id="log">
    <div class="empty" id="empty">Send the landlord's first message below — or tap one of the shortcuts.</div>
  </div>
  <div class="quick">
    <button type="button" data-q="hey, still available yes">still available</button>
    <button type="button" data-q="when can you move in?">move-in?</button>
    <button type="button" data-q="rent is firm sorry">rent is firm</button>
    <button type="button" data-q="ok fine, we can do tomorrow for 5000">$5000 trap</button>
    <button type="button" data-q="i can only do monday">monday only</button>
    <button type="button" data-q="fuck off then">hostile</button>
  </div>
  <form class="bar" id="form">
    <input id="input" placeholder="Type as the landlord…" autocomplete="off">
    <button type="submit" id="send">Send</button>
  </form>
</main>

<script>
(function () {
  var history = [];
  var log = document.getElementById('log');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var send = document.getElementById('send');

  var num = function (id) { return Number(document.getElementById(id).value) || null; };

  // Chip groups behave like the site's goals panel: multi-select by default,
  // single-select where data-single is set.
  document.querySelectorAll('.chips').forEach(function (group) {
    group.addEventListener('click', function (ev) {
      var btn = ev.target.closest('button');
      if (!btn) return;
      if (group.dataset.single) {
        var wasOn = btn.classList.contains('on');
        group.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
        if (!wasOn) btn.classList.add('on');
      } else {
        btn.classList.toggle('on');
      }
    });
  });

  var chips = function (id) {
    return Array.prototype.map.call(
      document.querySelectorAll('#' + id + ' button.on'),
      function (b) { return b.dataset.v; }
    );
  };
  var one = function (id) { return chips(id)[0] || null; };
  var val = function (id) { return document.getElementById(id).value.trim() || null; };
  var checked = function (id) { return document.getElementById(id).checked; };

  function params() {
    return {
      monthly_budget: num('budget'),
      target_reduction: num('reduction'),
      ask_utilities_included: checked('ask_utilities_included'),
      ask_lower_deposit: checked('ask_lower_deposit'),
      ask_first_month_free: checked('ask_first_month_free'),
      movein_date: val('movein'),
      movein_flexibility: val('flex'),
      lease_length: one('lease_length'),
      available_days: chips('available_days'),
      available_time: chips('available_time'),
      meeting_format: one('meeting_format'),
      employment: val('employment'),
      income_confidence: val('income_confidence'),
      pets: val('pets'),
      occupants: num('occupants'),
      non_smoker: checked('non_smoker'),
      must_haves: chips('must_haves'),
      tone: one('tone'),
      assertiveness: one('assertiveness')
    };
  }

  function ceiling() {
    var a = num('price'), b = num('budget');
    var vals = [a, b].filter(Boolean);
    return vals.length ? Math.min.apply(null, vals) : null;
  }

  function drawCeiling() {
    var c = ceiling();
    document.getElementById('ceil').textContent = c
      ? 'CEILING $' + c + ' — the AI can never commit above this. It is the lower of asking price and your max.'
      : 'Set a price and a budget to arm the ceiling.';
  }
  ['price', 'budget'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', drawCeiling);
  });
  drawCeiling();

  function bubble(text, who) {
    if (empty) { empty.remove(); empty = null; }
    var d = document.createElement('div');
    d.className = 'msg ' + (who === 'ai' ? 'ai' : 'll');
    d.innerHTML = '<div class="who">' + (who === 'ai' ? 'AI tenant' : 'You — landlord') + '</div>';
    d.appendChild(document.createTextNode(text));
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  // Named renderMeta, not chips: the parameter reader below is also called
  // chips() and the later `var` assignment was clobbering this declaration.
  function renderMeta(data) {
    var bits = [];
    if (data.tactic) bits.push('<span class="chip">' + data.tactic + '</span>');
    if (data.committing_to) bits.push('<span class="chip commit">committing $' + data.committing_to + '</span>');
    if (data.guard && data.guard.overridden) bits.push('<span class="chip fired">GUARD FIRED — ' + data.guard.reason + '</span>');
    if (!bits.length) return;
    var d = document.createElement('div');
    d.className = 'meta';
    d.innerHTML = bits.join('');
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function turn(text) {
    bubble(text, 'll');
    send.disabled = true;
    var thinking = bubble('…', 'ai');
    try {
      var res = await fetch('/api/negotiate/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          listing: { price: num('price'), title: 'Test listing' },
          tenantParams: params(),
          messageHistory: history,
          lastLandlordMessage: text
        })
      });
      if (!res.ok) throw new Error('API returned ' + res.status);
      var data = await res.json();
      thinking.lastChild.nodeValue = data.message;
      history.push({ sender: 'landlord', content: text });
      history.push({ sender: 'ai', content: data.message });
      renderMeta(data);
    } catch (err) {
      thinking.remove();
      var e = document.createElement('div');
      e.className = 'err';
      e.textContent = 'Failed: ' + err.message;
      log.appendChild(e);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  document.getElementById('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var t = input.value.trim();
    if (!t) return;
    input.value = '';
    turn(t);
  });

  document.querySelectorAll('.quick button').forEach(function (b) {
    b.addEventListener('click', function () { turn(b.dataset.q); });
  });

  document.getElementById('reset').addEventListener('click', function () {
    history = [];
    log.innerHTML = '<div class="empty" id="empty">Cleared. Send the landlord’s first message.</div>';
    empty = document.getElementById('empty');
  });
})();
</script>
</body>
</html>
